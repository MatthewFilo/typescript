<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <rect width="120" height="120" rx="16" fill="#06181f"/>
  <!-- Orbit 1 (horizontal) -->
  <ellipse cx="60" cy="54" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="2.5"/>
  <!-- Orbit 2 (rotated 60°) -->
  <ellipse cx="60" cy="54" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="2.5" transform="rotate(60 60 54)"/>
  <!-- Orbit 3 (rotated 120°) -->
  <ellipse cx="60" cy="54" rx="42" ry="16" fill="none" stroke="#61dafb" stroke-width="2.5" transform="rotate(120 60 54)"/>
  <!-- Nucleus -->
  <circle cx="60" cy="54" r="7" fill="#61dafb"/>
  <circle cx="60" cy="54" r="3.5" fill="#06181f"/>
  <!-- Label -->
  <text x="60" y="110" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="700" fill="#61dafb" text-anchor="middle" letter-spacing="1">REACT</text>
</svg>
